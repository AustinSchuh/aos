[package]
name = "compile_with_bazel"
version = "0.0.0"

# Mandatory (or Cargo tooling is unhappy)
[lib]
path = "fake_lib.rs"

[workspace]
members = []
exclude = [
    "third_party/cargo",
]

[dependencies]
clap = { version = "4.4", features = ["derive", "string"] }
cxx = "1.0"
cxxbridge-macro = "1.0"
uuid = "1.0"
toml = "0.5"
anyhow = "1.0"
futures = "0.3"
once_cell = "1.13"
thiserror = "1.0"
bitflags = "1.3"
smallvec = "1.9"
log = "0.4"
env_logger = "0.8"

# For bindgen.
bindgen = "0.58.1"
libloading = "=0.6.3"

# Bazel toolchains take care of linking the C++ standard library, so don't add
# an extra flag via Rust by enabling the `nothing` feature. I'm not even sure
# it would end up on the link command line, but this crate's build.rs attempts
# to find a C++ compiler itself otherwise which definitely doesn't work.
link-cplusplus = { version = "1.0", features = ["nothing"] }

# Note: these are from Flatbuffes.  Since we are building it from source in a
# vendored repository, dependencies aren't getting tracked correctly.  This is
# way less ugly than the alternatives.
serde = { version = "1.0", optional = true }
arrayvec = "0.7.4"

# The robot's HTTPS front door (aos/network/robot_server).  rustls uses ring
# rather than aws-lc-rs, which needs cmake and a much bigger C build.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "fs", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
# robot_server starts as root to bind 443 and 80, then drops to its user.
libc = "0.2"

# camera_streamer: encoding and WebRTC.  0.24 is the newest gstreamer-rs that
# Rust 1.85 builds, and v1_22 is the oldest GStreamer it has to run against (the
# amd64 sysroot's; the Orin has 1.28).  Their -sys crates' build scripts are
# off; third_party/gstreamer links the sysroots' libraries instead.
gstreamer = { version = "0.24", features = ["v1_22"] }
gstreamer-app = { version = "0.24", features = ["v1_22"] }
gstreamer-sdp = { version = "0.24", features = ["v1_22"] }
gstreamer-video = { version = "0.24", features = ["v1_22"] }
gstreamer-webrtc = { version = "0.24", features = ["v1_22"] }
# camera_streamer's signalling messages.  Already in Cargo.lock, under axum.
serde_json = "1.0"
